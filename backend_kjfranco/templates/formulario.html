<!DOCTYPE html>
<html>
<head>
    <title>{% if item %}Editar{% else %}Nuevo{% endif %} Bien</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #003366; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; color: white; cursor: pointer; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        .btn-cancel { background-color: #6c757d; }
        .btn-cancel:hover { background-color: #5a6268; }
        .alert { padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="container">
    <h1>{% if item %}✏️ Editar Bien{% else %}➕ Nuevo Bien{% endif %}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Ubicación actual:</label>
        <input type="text" name="ubicacion_actual" value="{{ item.ubicacion_actual if item else '' }}" required>

        <label>Cantidad:</label>
        <input type="number" name="cantidad" value="{{ item.cantidad if item else 1 }}" min="1" required>

        <label>Código ISTG:</label>
        <input type="text" name="codigo_istg" value="{{ item.codigo_istg if item else '' }}" required>

        <label>Código Senescyt:</label>
        <input type="text" name="codigo_senescyt" value="{{ item.codigo_senescyt if item else '' }}" required>

        <label>Tipo de bien:</label>
        <input type="text" name="tipo_bien" value="{{ item.tipo_bien if item else '' }}" required>

        <label>Descripción del bien:</label>
        <textarea name="descripcion_bien" required>{{ item.descripcion_bien if item else '' }}</textarea>

        <label>Marca:</label>
        <input type="text" name="marca" value="{{ item.marca if item else '' }}" required>

        <label>Estado del bien:</label>
        <select name="estado_bien" required>
            <option value="Bueno" {% if item and item.estado_bien == 'Bueno' %}selected{% endif %}>Bueno</option>
            <option value="Regular" {% if item and item.estado_bien == 'Regular' %}selected{% endif %}>Regular</option>
            <option value="Malo" {% if item and item.estado_bien == 'Malo' %}selected{% endif %}>Malo</option>
        </select>

        <label>Gestor responsable:</label>
        <input type="text" name="gestor_responsable" value="{{ item.gestor_responsable if item else '' }}" required>

        <label>Custodio final:</label>
        <input type="text" name="custodio_final" value="{{ item.custodio_final if item else '' }}" required>

        <label>Cargo:</label>
        <input type="text" name="cargo" value="{{ item.cargo if item else '' }}" required>

        <label>Número de acta:</label>
        <input type="text" name="no_acta" value="{{ item.no_acta if item else '' }}" required>

        <label>Observación:</label>
        <textarea name="observacion">{{ item.observacion if item else '' }}</textarea>

        <div class="btn-group">
            <button type="submit" class="btn btn-save">💾 Guardar</button>
            <a href="/items" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
