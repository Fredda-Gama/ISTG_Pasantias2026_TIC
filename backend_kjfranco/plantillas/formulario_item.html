<!DOCTYPE html>
<html>
<head>
    <title>{% if accion == 'nuevo' %}Nuevo{% else %}Editar{% endif %} bien</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 30px auto; }
        .mensaje { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid #ddd; }
        input[type="submit"] { background: #28a745; color: white; padding: 10px; border: none; cursor: pointer; }
        .cancelar { background: #6c757d; color: white; padding: 10px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <h1>{% if accion == 'nuevo' %}Agregar nuevo bien{% else %}Editar bien{% endif %}</h1>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
            {% for categoria, mensaje in mensajes %}
                <div class="mensaje {{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <label>Ubicación actual:</label>
        <input type="text" name="ubicacion_actual" value="{{ item.ubicacion_actual if item else '' }}" required>

        <label>Cantidad:</label>
        <input type="number" name="cantidad" value="{{ item.cantidad if item else 1 }}" required min="1">

        <label>Código ISTG:</label>
        <input type="text" name="codigo_istg" value="{{ item.codigo_istg if item else '' }}" required>

        <label>Código Senescyt:</label>
        <input type="text" name="codigo_senescyt" value="{{ item.codigo_senescyt if item else '' }}" required>

        <label>Tipo de bien:</label>
        <input type="text" name="tipo_bien" value="{{ item.tipo_bien if item else '' }}" required>

        <label>Descripción:</label>
        <textarea name="descripcion_bien" rows="3" required>{{ item.descripcion_bien if item else '' }}</textarea>

        <label>Marca:</label>
        <input type="text" name="marca" value="{{ item.marca if item else '' }}" required>

        <label>Estado:</label>
        <select name="estado_bien" required>
            <option value="Bueno" {% if item and item.estado_bien == 'Bueno' %}selected{% endif %}>Bueno</option>
            <option value="Regular" {% if item and item.estado_bien == 'Regular' %}selected{% endif %}>Regular</option>
            <option value="Malo" {% if item and item.estado_bien == 'Malo' %}selected{% endif %}>Malo</option>
        </select>

        <label>Gestor responsable:</label>
        <input type="text" name="gestor_responsable" value="{{ item.gestor_responsable if item else '' }}" required>

        <label>Custodio final:</label>
        <input type="text" name="custodio_final" value="{{ item.custodio_final if item else '' }}" required>

        <label>Cargo:</label>
        <input type="text" name="cargo" value="{{ item.cargo if item else '' }}" required>

        <label>No. Acta:</label>
        <input type="text" name="no_acta" value="{{ item.no_acta if item else '' }}" required>

        <label>Observación:</label>
        <textarea name="observacion" rows="2">{{ item.observacion if item else '' }}</textarea>

        <input type="submit" value="{% if accion == 'nuevo' %}Guardar{% else %}Actualizar{% endif %}">
        <a href="{{ url_for('listar_items') }}" class="cancelar">Cancelar</a>
    </form>
</body>
</html>
