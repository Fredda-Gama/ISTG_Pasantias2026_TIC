<!DOCTYPE html>
<html>
<head>
    <title>{% if item %}Editar{% else %}Agregar{% endif %} bien</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        input, select, textarea { display: block; margin: 10px 0; padding: 8px; width: 300px; }
        input[type="submit"] { width: auto; background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        .flash { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .flash.success { background-color: #d4edda; color: #155724; }
        .flash.danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>{% if item %}Editar{% else %}Agregar nuevo{% endif %} bien</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST" action="{% if item %}/editar/{{ item.id }}{% else %}/guardar{% endif %}">
        <input type="text" name="ubicacion_actual" placeholder="Ubicación actual" value="{{ item.ubicacion_actual if item else '' }}" required>
        <input type="number" name="cantidad" placeholder="Cantidad" value="{{ item.cantidad if item else 1 }}" required>
        <input type="text" name="codigo_istg" placeholder="Código ISTG" value="{{ item.codigo_istg if item else '' }}" required>
        <input type="text" name="codigo_senescyt" placeholder="Código Senescyt" value="{{ item.codigo_senescyt if item else '' }}" required>
        <input type="text" name="tipo_bien" placeholder="Tipo de bien" value="{{ item.tipo_bien if item else '' }}" required>
        <textarea name="descripcion_bien" placeholder="Descripción" required>{{ item.descripcion_bien if item else '' }}</textarea>
        <input type="text" name="marca" placeholder="Marca" value="{{ item.marca if item else '' }}" required>
        <select name="estado_bien" required>
            <option value="Bueno" {% if item and item.estado_bien == 'Bueno' %}selected{% endif %}>Bueno</option>
            <option value="Regular" {% if item and item.estado_bien == 'Regular' %}selected{% endif %}>Regular</option>
            <option value="Malo" {% if item and item.estado_bien == 'Malo' %}selected{% endif %}>Malo</option>
        </select>
        <input type="text" name="gestor_responsable" placeholder="Gestor responsable" value="{{ item.gestor_responsable if item else '' }}" required>
        <input type="text" name="custodio_final" placeholder="Custodio final" value="{{ item.custodio_final if item else '' }}" required>
        <input type="text" name="cargo" placeholder="Cargo" value="{{ item.cargo if item else '' }}" required>
        <input type="text" name="no_acta" placeholder="N° Acta" value="{{ item.no_acta if item else '' }}" required>
        <textarea name="observacion" placeholder="Observación">{{ item.observacion if item else '' }}</textarea>
        <input type="submit" value="{% if item %}Actualizar{% else %}Guardar{% endif %} bien">
    </form>
    <a href="/items">Volver a la lista</a>
</body>
</html>
